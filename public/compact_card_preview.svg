<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 740" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Mobile Device Frame Container -->
  <rect x="10" y="10" width="380" height="720" rx="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Phone Status Bar -->
  <text x="36" y="38" font-size="12" font-weight="700" fill="#0f172a">11:07</text>
  <circle cx="340" cy="34" r="3" fill="#0f172a"/>
  <rect x="348" y="28" width="18" height="11" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="350" y="30" width="12" height="7" rx="1.5" fill="#0f172a"/>

  <!-- Top App Header -->
  <rect x="26" y="54" width="34" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M34 65h18M34 71h18M34 77h18" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  
  <rect x="68" y="54" width="34" height="34" rx="8" fill="#4f46e5"/>
  <path d="M85 62 L93 66.5 L85 71 L77 66.5 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M77 66.5 L85 71 L85 80 L77 75.5 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M93 66.5 L85 71 L85 80 L93 75.5 Z" fill="#ffffff" opacity="0.5"/>

  <text x="110" y="76" font-size="15" font-weight="700" fill="#0f172a">Inventory &amp; Stock Master</text>
  <circle cx="350" cy="71" r="5" fill="#10b981"/>

  <!-- Search Bar -->
  <rect x="26" y="102" width="348" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="46" cy="122" r="5" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="50" y1="126" x2="55" y2="131" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="64" y="126" font-size="13" fill="#94a3b8">Search by name, SKU, supplier...</text>

  <!-- ==================== FULL-NAME 2-ROW CARDS (NO TRUNCATION) ==================== -->
  
  <!-- Card 1 -->
  <g transform="translate(26, 156)">
    <rect x="0" y="0" width="348" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="14" y="27" font-size="13.5" font-weight="800" fill="#0f172a">TOP N-70 REG RED R PLATE</text>
    <line x1="14" y1="42" x2="334" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    
    <rect x="14" y="49" width="82" height="19" rx="5" fill="#fef3c7" stroke="#fde68a"/>
    <text x="21" y="62.5" font-size="10" font-weight="600" fill="#92400e">Raw Material</text>

    <text x="282" y="63" font-size="14" font-weight="800" fill="#e11d48">0.0 <tspan font-size="11" font-weight="500" fill="#64748b">pcs</tspan></text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(26, 240)">
    <rect x="0" y="0" width="348" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="14" y="27" font-size="13.5" font-weight="800" fill="#0f172a">TOP N-50 REG RED R PLATE</text>
    <line x1="14" y1="42" x2="334" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    
    <rect x="14" y="49" width="82" height="19" rx="5" fill="#fef3c7" stroke="#fde68a"/>
    <text x="21" y="62.5" font-size="10" font-weight="600" fill="#92400e">Raw Material</text>

    <text x="282" y="63" font-size="14" font-weight="800" fill="#e11d48">0.0 <tspan font-size="11" font-weight="500" fill="#64748b">pcs</tspan></text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(26, 324)">
    <rect x="0" y="0" width="348" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="14" y="27" font-size="13.5" font-weight="800" fill="#0f172a">TOP N-45 AMRON L POLL</text>
    <line x1="14" y1="42" x2="334" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    
    <rect x="14" y="49" width="82" height="19" rx="5" fill="#fef3c7" stroke="#fde68a"/>
    <text x="21" y="62.5" font-size="10" font-weight="600" fill="#92400e">Raw Material</text>

    <text x="282" y="63" font-size="14" font-weight="800" fill="#e11d48">0.0 <tspan font-size="11" font-weight="500" fill="#64748b">pcs</tspan></text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(26, 408)">
    <rect x="0" y="0" width="348" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="14" y="27" font-size="13.5" font-weight="800" fill="#0f172a">TOP N-40 GVP BLUE WIRE TERMINAL</text>
    <line x1="14" y1="42" x2="334" y2="42" stroke="#f1f5f9" stroke-width="1"/>
    
    <rect x="14" y="49" width="82" height="19" rx="5" fill="#fef3c7" stroke="#fde68a"/>
    <text x="21" y="62.5" font-size="10" font-weight="600" fill="#92400e">Raw Material</text>

    <text x="282" y="63" font-size="14" font-weight="800" fill="#e11d48">0.0 <tspan font-size="11" font-weight="500" fill="#64748b">pcs</tspan></text>
  </g>
</svg>
